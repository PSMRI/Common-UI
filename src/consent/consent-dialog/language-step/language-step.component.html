<div class="consent-step">
  <p class="consent-label">{{ text?.chooseLanguage }}</p>
  <div *ngIf="failed" class="consent-alert" role="alert">
    <span>{{ text?.serviceUnavailable }}</span>
    <button mat-stroked-button type="button" (click)="load()">{{ text?.retry }}</button>
  </div>
  <div *ngIf="!failed" class="consent-options">
    <ng-container *ngFor="let language of languages">
      <button
        *ngIf="language.languageCode === selected"
        mat-flat-button
        color="primary"
        type="button"
        aria-pressed="true"
        [attr.lang]="language.languageCode"
        (click)="select(language.languageCode)"
      >
        {{ language.languageName }}
      </button>
      <button
        *ngIf="language.languageCode !== selected"
        mat-stroked-button
        type="button"
        aria-pressed="false"
        [attr.lang]="language.languageCode"
        (click)="select(language.languageCode)"
      >
        {{ language.languageName }}
      </button>
    </ng-container>
  </div>
</div>
