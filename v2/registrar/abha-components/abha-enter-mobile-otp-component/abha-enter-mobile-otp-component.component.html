<div class="flex flex-col gap-4 p-6">
  <div class="flex items-start justify-between gap-4">
    <p class="text-lg font-semibold text-foreground">
      {{ currentLanguageSet?.verifyMobileOtp }}
    </p>
    <button
      z-button
      zType="ghost"
      zSize="icon"
      class="p-0"
      type="button"
      aria-label="Close"
      (click)="closeDialog()"
    >
      <ng-icon name="lucideX"></ng-icon>
    </button>
  </div>

  <div
    *ngIf="showProgressBar"
    class="flex items-center justify-center py-4"
  >
    <z-loader></z-loader>
  </div>

  <form [formGroup]="generateMobileOTPForm" class="flex flex-col gap-4">
    <z-form-field>
      <label z-form-label for="mobileOtp">
        {{ currentLanguageSet?.enterMobileOtp }}
      </label>
      <z-form-control>
        <input
          z-input
          id="mobileOtp"
          class="w-full"
          autocomplete="off"
          required
          type="text"
          formControlName="mobileOtp"
          minlength="6"
          maxlength="6"
          (keypress)="numberOnly($event)"
        />
      </z-form-control>
    </z-form-field>

    <div class="flex justify-end gap-2">
      <button
        id="resendButton"
        z-button
        zType="outline"
        type="button"
        (click)="mobileEnrollmentForAbha()"
      >
        {{ currentLanguageSet?.resendOTP }}
      </button>
      <button
        id="nextButton"
        z-button
        type="button"
        [disabled]="!generateMobileOTPForm.valid"
        (click)="verifyMobileAuthAfterAbhaCreation()"
      >
        {{ currentLanguageSet?.verify }}
      </button>
    </div>
  </form>
</div>
