<div class="flex flex-col gap-4 p-6">
  <div class="flex items-start justify-between gap-4">
    <p class="text-lg font-semibold text-foreground">
      {{ currentLanguageSet?.generateABHA }}
    </p>
    <button
      z-button
      zType="ghost"
      zSize="icon"
      class="p-0"
      type="button"
      aria-label="Close"
      (click)="closeDialog()"
    >
      <ng-icon name="lucideX"></ng-icon>
    </button>
  </div>

  <div
    *ngIf="showProgressBar"
    class="flex items-center justify-center py-4"
  >
    <z-loader></z-loader>
  </div>

  <form [formGroup]="generateMobileOTPForm" novalidate class="flex flex-col gap-4">
    <z-form-field>
      <label z-form-label for="mobileNo">
        {{ currentLanguageSet?.enterMobileNumberToBeLinkedWithAbha }}
      </label>
      <z-form-control>
        <input
          z-input
          id="mobileNo"
          class="w-full"
          autocomplete="off"
          type="text"
          required
          formControlName="mobileNo"
          minlength="10"
          maxlength="10"
          (keypress)="numberOnly($event)"
        />
      </z-form-control>
      <z-form-message
        zType="error"
        *ngIf="generateMobileOTPForm.controls['mobileNo'].errors?.['required']"
      >
        {{ currentLanguageSet?.benDetailsAlert?.mobNoMandatory }}
      </z-form-message>
      <z-form-message
        zType="error"
        *ngIf="generateMobileOTPForm.controls['mobileNo'].errors?.['minlength']"
      >
        {{ currentLanguageSet?.benDetailsAlert?.minDigitsRequired }}
      </z-form-message>
    </z-form-field>

    <div class="flex justify-end gap-2">
      <button
        id="submitButton"
        z-button
        type="button"
        [disabled]="!generateMobileOTPForm.valid"
        (click)="onSubmitOfMobileNo()"
      >
        {{ currentLanguageSet?.common?.submit }}
      </button>
    </div>
  </form>
</div>
