<div class="flex flex-col gap-4 p-6">
  <div class="flex items-start justify-between gap-4">
    <p class="text-lg font-semibold text-foreground">
      <span *ngIf="!enableSubmitForVerify">{{ currentLanguageSet?.generateABHA }}</span>
      <span *ngIf="enableSubmitForVerify">{{ currentLanguageSet?.verifyAbha }}</span>
    </p>
    <button
      z-button
      zType="ghost"
      zSize="icon"
      class="p-0"
      type="button"
      aria-label="Close"
      (click)="closeDialog()"
    >
      <ng-icon name="lucideX"></ng-icon>
    </button>
  </div>

  <div
    *ngIf="showProgressBar"
    class="flex items-center justify-center py-4"
  >
    <z-loader></z-loader>
  </div>

  <form [formGroup]="healthIdOTPForm" class="flex flex-col gap-4">
    <z-form-field>
      <label z-form-label for="otp">
        {{ currentLanguageSet?.enterOTP }}
      </label>
      <z-form-control>
        <input
          z-input
          id="otp"
          class="w-full"
          autocomplete="off"
          required
          type="text"
          formControlName="otp"
          minlength="6"
          maxlength="6"
          (keypress)="numberOnly($event)"
        />
      </z-form-control>
    </z-form-field>

    <div class="flex justify-end gap-2">
      <button
        *ngIf="!enableSubmitForVerify"
        id="cancelButton"
        z-button
        zType="outline"
        type="button"
        (click)="resendOtp()"
        [disabled]="!enableResend"
      >
        {{ currentLanguageSet?.resendOTP }}
        <span *ngIf="countdown > 0">&nbsp;in {{ countdown }} seconds</span>
      </button>
      <button
        *ngIf="enableSubmitForVerify"
        id="cancelButton"
        z-button
        zType="outline"
        type="button"
        (click)="resendOtpForVerify()"
        [disabled]="!enableResend"
      >
        {{ currentLanguageSet?.resendOTP }}
        <span *ngIf="countdown > 0">&nbsp;in {{ countdown }} seconds</span>
      </button>
      <button
        *ngIf="!enableSubmitForVerify"
        id="nextButton"
        z-button
        type="button"
        [disabled]="!healthIdOTPForm.valid || !checkOTP()"
        (click)="askMobileNumberForAbha()"
      >
        {{ currentLanguageSet?.common?.next }}
      </button>
      <button
        *ngIf="enableSubmitForVerify"
        id="submitButton"
        z-button
        type="button"
        [disabled]="!healthIdOTPForm.valid"
        (click)="verifyAbhaLogin()"
      >
        {{ currentLanguageSet?.common?.submit }}
      </button>
    </div>
  </form>
</div>
