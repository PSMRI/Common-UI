<ul class="m-0 flex list-none flex-col gap-2 p-0">
  @for (purpose of sorted; track purpose.purposeCode) {
    <li class="flex items-start justify-between gap-3 rounded-lg border border-input bg-card p-3 transition-colors hover:bg-muted/40">
      <z-checkbox
        [zId]="'consent-purpose-' + purpose.purposeCode"
        [zChecked]="isOn(purpose.purposeCode)"
        (zCheckedChange)="toggle(purpose.purposeCode, $event)"
      >
        <span class="flex flex-col gap-0.5">
          <span class="text-sm font-medium text-foreground">{{ purpose.name }}</span>
          <span class="text-xs text-muted-foreground">{{ purpose.description }}</span>
        </span>
      </z-checkbox>
      <z-badge class="shrink-0" [zType]="purpose.isMandatory ? 'secondary' : 'outline'">
        {{ purpose.isMandatory ? text?.mandatory : text?.optional }}
      </z-badge>
    </li>
  }
</ul>
