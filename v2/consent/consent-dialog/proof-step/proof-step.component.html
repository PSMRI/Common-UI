<fieldset class="flex flex-col gap-3">
  <legend class="text-sm font-medium text-foreground">{{ text?.mode }}</legend>
  <z-radio-group
    name="consent-mode"
    zOrientation="horizontal"
    class="flex-wrap gap-4"
    [ngModel]="mode"
    (zChange)="selectMode($event)"
  >
    @for (option of modes; track option.mode) {
      <z-radio [value]="option.mode">{{ text?.[option.key] }}</z-radio>
    }
  </z-radio-group>

  @switch (mode) {
    @case ('READ_ALOUD') {
      <z-checkbox
        zId="consent-worker-confirm"
        [zChecked]="proof.workerConfirmed === true"
        (zCheckedChange)="setWorkerConfirmed($event)"
      >
        {{ text?.workerConfirm }}
      </z-checkbox>
    }
    @case ('VOICE_CLIP') {
      <app-consent-media-capture
        kind="voice"
        [text]="text"
        [label]="text?.recordVoice"
        (captured)="onVoice($event)"
      ></app-consent-media-capture>
    }
    @case ('WITNESSED') {
      <div class="flex flex-wrap gap-3">
        <label class="flex flex-col gap-1 text-sm text-foreground">
          {{ text?.witnessName }}
          <input
            z-input
            type="text"
            name="consent-witness-name"
            maxlength="100"
            [value]="proof.witnessName || ''"
            (input)="setWitness('witnessName', $any($event.target).value)"
          />
        </label>
        <label class="flex flex-col gap-1 text-sm text-foreground">
          {{ text?.witnessRelationship }}
          <input
            z-input
            type="text"
            name="consent-witness-relationship"
            maxlength="100"
            [value]="proof.witnessRelationship || ''"
            (input)="setWitness('witnessRelationship', $any($event.target).value)"
          />
        </label>
      </div>
    }
    @case ('SIGNATURE_PHOTO') {
      <div class="flex flex-wrap gap-6">
        <app-consent-media-capture
          kind="photo"
          class="consent-patient-photo"
          [text]="text"
          [label]="text?.patientPhoto"
          (captured)="onPhoto('patientPhoto', $event)"
        ></app-consent-media-capture>
        <app-consent-media-capture
          kind="photo"
          class="consent-form-photo"
          [text]="text"
          [label]="text?.signedFormPhoto"
          (captured)="onPhoto('signedFormPhoto', $event)"
        ></app-consent-media-capture>
      </div>
    }
    @case ('OTP') {
      <app-consent-otp-verify
        purpose="CONSENT"
        [text]="text"
        [phone]="patientPhone"
        (verified)="onOtpVerified($event)"
      ></app-consent-otp-verify>
    }
  }
</fieldset>
